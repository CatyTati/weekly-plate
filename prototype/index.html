<title>צלחת השבוע</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@400;600;700&family=Rubik:wght@400;600;700&display=swap">
<style>
/* Layout: one column kitchen-notebook app — sticky tab bar, week as day rows, list views below */
:root{
  --bg:#F4F7F2; --surface:#FFFFFF; --ink:#1C251F; --muted:#5A6A5F; --line:#DCE3D8;
  --accent:#2E6A3E; --accent-ink:#FFFFFF; --accent-soft:#E2EEE3;
  --kids:#B8436F; --kids-soft:#F8E6EE; --budget:#9A6A00; --budget-soft:#FBF0D6;
  --quick:#2C67AC; --quick-soft:#E3EDF9; --prep:#2E6A3E; --prep-soft:#E2EEE3;
  --warn:#B4441F;
  --display:"Suez One","Rubik","Assistant",system-ui,sans-serif;
  --body:"Assistant","Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111612; --surface:#1A211C; --ink:#E6EDE7; --muted:#9BAA9F; --line:#2C3830;
  --accent:#7CC490; --accent-ink:#0F1A12; --accent-soft:#1E3325;
  --kids:#F08DB1; --kids-soft:#3A2030; --budget:#E9B949; --budget-soft:#352A12;
  --quick:#86B5EE; --quick-soft:#1C2A3D; --prep:#7CC490; --prep-soft:#1E3325; --warn:#F08A64;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111612; --surface:#1A211C; --ink:#E6EDE7; --muted:#9BAA9F; --line:#2C3830;
  --accent:#7CC490; --accent-ink:#0F1A12; --accent-soft:#1E3325;
  --kids:#F08DB1; --kids-soft:#3A2030; --budget:#E9B949; --budget-soft:#352A12;
  --quick:#86B5EE; --quick-soft:#1C2A3D; --prep:#7CC490; --prep-soft:#1E3325; --warn:#F08A64;
  color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.1}
h2{font-size:1.35rem}
h3{font-size:1.1rem}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.sub{color:var(--muted);margin:4px 0 0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.setup{margin-top:18px;display:grid;gap:14px}
.label{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.modes{display:flex;flex-wrap:wrap;gap:8px}
.mode{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;display:flex;gap:6px;align-items:center}
.mode .dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.mode[aria-pressed="true"]{border-color:currentColor}
.mode[data-m="kids"][aria-pressed="true"]{color:var(--kids);background:var(--kids-soft)}
.mode[data-m="budget"][aria-pressed="true"]{color:var(--budget);background:var(--budget-soft)}
.mode[data-m="prep"][aria-pressed="true"]{color:var(--prep);background:var(--prep-soft)}
.mode[data-m="quick"][aria-pressed="true"]{color:var(--quick);background:var(--quick-soft)}
.mode[aria-pressed="true"] .dot{background:currentColor}
.controls{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:end}
.field{display:grid;gap:4px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:transparent;width:36px;height:36px;font-size:1.2rem}
.stepper span{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
input[type=number],input[type=text],input[type=search],select,textarea{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:7px 10px;min-height:36px}
input[type=number]{width:110px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 18px;font-weight:700}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:600}
.hint{font-size:.9rem;color:var(--muted)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:18px;padding-block:10px;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:10px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.view{margin-top:18px}
.summary{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center;margin-bottom:14px}
.stat b{font-size:1.25rem;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;width:220px;max-width:100%}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over i{background:var(--warn)}
.week{display:grid;gap:8px}
.day{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:6px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.dname{font-family:var(--display);font-size:1.05rem}
.dname small{display:block;font-family:var(--body);font-size:.75rem;color:var(--muted)}
.rname{font-weight:700;font-size:1.05rem}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px;font-size:.85rem;color:var(--muted)}
.tag{font-size:.75rem;font-weight:700;border-radius:99px;padding:1px 8px}
.t-kids{color:var(--kids);background:var(--kids-soft)}
.t-budget{color:var(--budget);background:var(--budget-soft)}
.t-quick{color:var(--quick);background:var(--quick-soft)}
.t-prep{color:var(--prep);background:var(--prep-soft)}
.note{font-size:.85rem;color:var(--muted);margin-top:4px}
.note b{color:var(--kids)}
.dact{display:flex;gap:6px;align-items:center}
.dact select{max-width:170px}
.empty{color:var(--muted);font-style:italic}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.aisle h3{margin-bottom:8px}
.item{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item input{width:18px;height:18px;accent-color:var(--accent)}
.item .q{margin-inline-start:auto;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.item.done span{text-decoration:line-through;color:var(--muted)}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.rcard{display:grid;gap:6px;align-content:start}
.rcard details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem}
.rcard ul{margin:6px 0 0;padding-inline-start:18px;font-size:.9rem}
.rfoot{display:flex;gap:8px;align-items:center;margin-top:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.steps{display:grid;gap:12px}
.step{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px}
.num{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.step ul{margin:6px 0 0;padding-inline-start:18px}
.addform{display:grid;gap:10px;margin-top:10px}
.addform .row{display:flex;flex-wrap:wrap;gap:10px}
.addform textarea{min-height:96px;width:100%;box-sizing:border-box}
.cooks{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.cook{display:grid;gap:8px;align-content:start}
.chead{display:flex;gap:12px;align-items:center}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.2rem;background:var(--accent-soft);color:var(--accent);flex:none}
.chead>div{min-width:0}
.follow[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sample{font-size:.7rem;font-weight:700;color:var(--muted);border:1px dashed var(--line);border-radius:99px;padding:0 7px}
.feed{display:grid;gap:12px;margin-top:18px}
.mini{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:2px;font-size:.9rem}
.mini b{display:inline-block;min-width:52px;color:var(--muted);font-weight:600}
.rcard ol{margin:6px 0 0;padding-inline-start:20px;font-size:.9rem}
.photos{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;margin:-4px -4px 4px}
.photos img{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block}
.photos[style*="--n:1"] img{aspect-ratio:16/9}
.danger{color:var(--warn)}
.addbox{margin-top:14px}
.addbox summary{cursor:pointer}
fieldset{border:0;margin:0;padding:0;min-width:0}
.grow{flex:1;min-width:200px}
.grow input{width:100%;box-sizing:border-box}
.check{display:flex;gap:6px;align-items:center}
.inghead,.ingrow{display:grid;grid-template-columns:minmax(0,2fr) 84px minmax(0,1fr) minmax(0,1.3fr) 36px;gap:6px;align-items:center}
.inghead{font-size:.75rem;color:var(--muted);font-weight:700}
.ingrow{margin-top:6px}
.ingrow input,.ingrow select{width:100%;box-sizing:border-box;min-width:0}
.icon{width:36px;height:36px;padding:0;font-size:1.1rem}
.icon:disabled{opacity:.4;cursor:not-allowed}
.err{color:var(--warn);font-size:.85rem;font-weight:600;margin:4px 0 0}
[aria-invalid="true"]{border-color:var(--warn)!important;box-shadow:0 0 0 1px var(--warn)}
.errsum{border:1.5px solid var(--warn);border-radius:10px;padding:10px 14px;color:var(--warn)}
.errsum ul{margin:4px 0 0;padding-inline-start:18px;color:var(--ink)}
.photogrid{display:flex;flex-wrap:wrap;gap:10px}
.ptile{position:relative;margin:0;width:120px;height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.ptile img{width:100%;height:100%;object-fit:cover;display:block}
.pmain{position:absolute;inset-block-end:6px;inset-inline-start:6px;background:var(--accent);color:var(--accent-ink);font-size:.7rem;font-weight:700;border-radius:99px;padding:0 7px}
.pdel{position:absolute;top:6px;inset-inline-end:6px;width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:1rem;line-height:1}
.padd{display:grid;place-items:center;align-content:center;gap:2px;border:1.5px dashed var(--line);cursor:pointer;text-align:center;color:var(--muted)}
.padd span{font-size:1.6rem;line-height:1;color:var(--accent)}
.padd:hover{border-color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#photoPrev:focus-within .padd{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:620px){
  .inghead{display:none}
  .ingrow{grid-template-columns:minmax(0,1fr) 84px 36px;padding-block:8px;border-top:1px solid var(--line)}
  .ingrow [data-f="n"]{grid-column:1;grid-row:1}
  .ingrow [data-f="q"]{grid-column:2;grid-row:1}
  .ingrow [data-rmrow]{grid-column:3;grid-row:1}
  .ingrow [data-f="u"]{grid-column:1;grid-row:2}
  .ingrow [data-f="a"]{grid-column:2/4;grid-row:2}
}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:620px){
  .day{grid-template-columns:56px minmax(0,1fr)}
  .dact{grid-column:1/-1}
  .dact select{max-width:none;flex:1}
  h1{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.topact{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.langs{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.lang{border:0;background:transparent;padding:7px 12px;font-weight:600;color:var(--muted)}
.lang[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
:lang(ru) h1,:lang(ru) h2,:lang(ru) h3,:lang(ru) .dname{font-weight:600}
</style>

function load(){try{const s=JSON.parse(localStorage.getItem('tzalachat-v1'));if(s&&s.modes)return Object.assign({},DEF,s);}catch(e){}return JSON.parse(JSON.stringify(DEF));}
function save(){try{localStorage.setItem('tzalachat-v1',JSON.stringify(state));return true;}catch(e){return false;}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function t(k,v){let s=(S[lang]&&S[lang][k]!=null)?S[lang][k]:(S.he[k]!=null?S.he[k]:k);if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s;}
const L=x=>x==null?'':typeof x==='string'?x:(x[lang]||x.he);
const loc=()=>LANGS.find(l=>l.k===lang).loc;
const num=n=>Number(n).toLocaleString(loc());
const day=d=>DAYS[lang][d];
const aisle=a=>AISLES[lang][a];
const tagL=k=>t('tag_'+k);
const unitL=u=>lang==='he'?u:((UNIT_T[lang]||{})[u]||u);
const ingL=n=>lang==='he'?n:(ING[n]?ING[n][lang==='en'?0:1]:n);
const all=()=>R.concat(state.custom);
const byId=id=>all().find(r=>r.id===id);
const factor=()=>state.serv/4;
const cost=(r,f=factor())=>r.ing.reduce((s,i)=>s+i[1]*i[4]*f,0);
const hasPrice=r=>r.ing.some(i=>i[4]>0);
const money=n=>'₪'+num(Math.round(n));
function roundQ(q,u){if(u==='גרם')return Math.max(50,Math.round(q/50)*50);if(u==='מ״ל')return Math.max(10,Math.round(q/10)*10);if(['כוס','כף','כפית','ק״ג'].includes(u))return Math.round(q*2)/2||.5;return Math.ceil(q-1e-9);}
function fmtQ(q,u){const r=roundQ(q,u);if(u==='גרם'&&r>=1000)return num(r/1000)+' '+unitL('ק״ג');return num(r)+' '+unitL(u);}
const tagsHtml=r=>r.tags.map(k=>`<span class="tag t-${k}">${tagL(k)}</span>`).join('');
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove('on'),1800);}
function copy(txt,ok,fail){try{navigator.clipboard.writeText(txt).then(()=>toast(ok),()=>toast(fail||t('copyFailShort')));}catch(err){toast(fail||t('copyFailShort'));}}

/* ---------- planning ---------- */
function score(r,d){
  let s=Math.random()*1.5;const m=state.modes;
  if(m.kids&&r.tags.includes('kids'))s+=2;
  if(m.budget&&hasPrice(r)&&cost(r,1)/4<=12)s+=2;
  if(m.quick&&d<=4){if(r.time<=20)s+=2.5;else if(r.time<=30)s+=1;else s-=1.5;}
  if(m.prep&&r.tags.includes('prep'))s+=(d<=3?2:1);
  return s;
}
function autoPlan(){
  const used=new Set();state.plan=[];
  for(let d=0;d<7;d++){let best=null,bs=-1e9;all().forEach(r=>{if(used.has(r.id))return;const s=score(r,d);if(s>bs){bs=s;best=r;}});state.plan.push(best?best.id:null);if(best)used.add(best.id);}
  state.checked={};save();
}
function swapDay(d){
  const used=new Set(state.plan);let best=null,bs=-1e9;
  all().forEach(r=>{if(used.has(r.id))return;const s=score(r,d);if(s>bs){bs=s;best=r;}});
  if(best){state.plan[d]=best.id;save();render();toast(t('toastSwap',{d:day(d),n:L(best.name)}));}
}
const planned=()=>(state.plan||[]).map(byId).filter(Boolean);
const weekCost=()=>planned().reduce((s,r)=>s+cost(r),0);

/* ---------- views ---------- */
function renderWeek(){
  const total=weekCost(),pct=state.budget?Math.min(100,total/state.budget*100):0,over=state.budget&&total>state.budget;
  const opts=id=>`<option value="">${t('none')}</option>`+all().map(r=>`<option value="${r.id}"${r.id===id?' selected':''}>${esc(L(r.name))}</option>`).join('');
  let html=`<div class="summary">
    <div class="stat"><span class="label">${t('weekCost')}</span><br><b>${money(total)}</b> <span class="hint">${t('of',{b:money(state.budget)})}</span></div>
    <div class="bar${over?' over':''}" role="img" aria-label="${t('budgetUse',{p:Math.round(pct)})}"><i style="width:${pct}%"></i></div>
    <span class="hint">${over?t('overBudget'):t('inBudget')}</span></div><div class="week">`;
  state.plan.forEach((id,d)=>{
    const r=byId(id);
    html+=`<article class="day"><div class="dname">${day(d)}<small>${d<=4?t('weeknight'):t('weekend')}</small></div><div>`;
    if(r){
      html+=`<div class="rname">${esc(L(r.name))}</div><div class="meta"><span>${r.time} ${t('min')}</span><span>·</span><span>${hasPrice(r)?money(cost(r)):t('unknownCost')}</span>${tagsHtml(r)}</div>`;
      if(state.modes.kids&&r.kid)html+=`<div class="note"><b>${t('forKids')}</b> ${esc(L(r.kid))}</div>`;
      if(state.modes.prep&&r.tags.includes('prep'))html+=`<div class="note">${t('prepNote',{k:r.keep||3})}</div>`;
    }else html+=`<div class="empty">${t('noDinner')}</div>`;
    html+=`</div><div class="dact"><label for="sel${d}" hidden>${t('selectAria',{d:day(d)})}</label><select id="sel${d}" data-day="${d}">${opts(id)}</select><button class="ghost" data-swap="${d}" aria-label="${t('swapAria',{d:day(d)})}">${t('swap')}</button></div></article>`;
  });
  $('#v-week').innerHTML=html+'</div>';
}
function shoppingList(){
  const map={},f=factor();
  planned().forEach(r=>r.ing.forEach(([n,q,u,a,p])=>{const k=n+'|'+u;if(!map[k])map[k]={n,u,a,p,q:0};map[k].q+=q*f;}));
  return Object.values(map);
}
function renderShop(){
  const items=shoppingList();
  if(!items.length){$('#v-shop').innerHTML=`<p class="empty">${t('shopEmpty')}</p>`;return;}
  const left=items.filter(i=>!state.checked[i.n+'|'+i.u]).length;
  let html=`<div class="summary"><div class="stat"><span class="label">${t('itemsLeft')}</span><br><b>${num(left)}</b> <span class="hint">${t('of',{b:num(items.length)})}</span></div><div class="stat"><span class="label">${t('estCost')}</span><br><b>${money(weekCost())}</b></div><button class="ghost" id="copyList">${t('copyList')}</button><button class="ghost" id="clearChecks">${t('clearChecks')}</button></div><div class="shop">`;
  AISLE_ORDER.forEach(a=>{
    const list=items.filter(i=>i.a===a).sort((x,y)=>ingL(x.n).localeCompare(ingL(y.n),loc()));if(!list.length)return;
    html+=`<div class="panel aisle"><h3>${aisle(a)}</h3>`+list.map((i,idx)=>{const k=i.n+'|'+i.u,done=!!state.checked[k],cid='c-'+a+idx;
      return `<label class="item${done?' done':''}" for="${cid}"><input type="checkbox" id="${cid}" data-key="${esc(k)}"${done?' checked':''}><span>${esc(ingL(i.n))}</span><span class="q">${fmtQ(i.q,i.u)}</span></label>`;}).join('')+'</div>';
  });
  $('#v-shop').innerHTML=html+'</div>';
}
function listText(){
  const items=shoppingList();let s=t('listTitle',{app:t('app')})+'\n';
  AISLE_ORDER.forEach(a=>{const l=items.filter(i=>i.a===a);if(!l.length)return;s+='\n'+aisle(a)+'\n'+l.map(i=>'• '+ingL(i.n)+' – '+fmtQ(i.q,i.u)).join('\n')+'\n';});
  return s;
}
function renderPrep(){
  const rs=[...new Set(planned().filter(r=>r.tags.includes('prep')))];

  const oven=rs.filter(r=>r.m==='oven'),stove=rs.filter(r=>r.m!=='oven');
  const mins=Math.max(0,...oven.map(r=>r.time))+stove.reduce((s,r)=>s+r.time*.7,0)+20;
  const hours=Math.round(mins/30)/2;
  const li=r=>`<li>${esc(L(r.name))} <span class="hint">(${r.time} ${t('min')})</span></li>`;

   <div class="step"><span class="num">${++n}</span><div><h3>${t('step4')}</h3><ul>${rs.map(r=>`<li>${esc(L(r.name))}: ${t('keepsUpTo',{k:r.keep||3})}${r.freeze?t('freezes'):''}</li>`).join('')}</ul></div></div>

  const q=recSearch.toLowerCase();
  const list=all().filter(r=>(recFilter==='all'||r.tags.includes(recFilter))&&(!q||L(r.name).toLowerCase().includes(q)));
  let html=`<div class="filters" role="group" aria-label="${t('filterAria')}">${chips.map(([k,l])=>`<button class="ghost" data-filter="${k}" aria-pressed="${recFilter===k}" style="${recFilter===k?'border-color:var(--accent);color:var(--accent)':''}">${l}</button>`).join('')}
   <label for="rsearch" hidden>${t('search')}</label><input type="search" id="rsearch" placeholder="${t('search')}" value="${esc(recSearch)}"></div><div class="recipes">`;
  html+=list.map(r=>{
    const ph=r.photos||[],nm=L(r.name);
    const steps=(r.steps||'').split('\n').map(s=>s.trim()).filter(Boolean);
    return `<article class="panel rcard">
    ${ph.length?`<div class="photos" style="--n:${ph.length}">${ph.map((p,i)=>`<img src="${p}" alt="${esc(t('photoAlt',{n:nm,i:i+1,t:ph.length}))}">`).join('')}</div>`:''}
    <h3>${esc(nm)}${r.custom?` <span class="sample">${t('mine')}</span>`:''}</h3><div class="meta"><span>${r.time} ${t('min')}</span><span>·</span><span>${hasPrice(r)?t('perServing',{c:money(cost(r)/state.serv)}):t('unknownCost')}</span></div>${r.tags.length?`<div class="meta">${tagsHtml(r)}</div>`:''}
    ${r.kid?`<div class="note"><b>${t('forKids')}</b> ${esc(L(r.kid))}</div>`:''}${r.keep?`<div class="note">${t('keeps',{k:r.keep})}${r.freeze?t('freezes'):''}</div>`:''}
    <details><summary>${t('ingFor',{n:state.serv})}</summary><ul>${r.ing.map(([n,qq,u])=>`<li>${esc(ingL(n))} – ${fmtQ(qq*factor(),u)}</li>`).join('')}</ul></details>
    ${steps.length?`<details><summary>${t('method')}</summary><ol>${steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></details>`:''}
    <div class="rfoot"><label class="hint" for="add-${r.id}">${t('assign')}</label><select id="add-${r.id}" data-assign="${r.id}"><option value="">${t('choose')}</option>${DAYS[lang].map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select><button class="ghost" data-share="${r.id}">${t('share')}</button>${r.custom?`<button class="ghost danger" data-del="${r.id}">${pendingDel===r.id?t('delConfirm'):t('del')}</button>`:''}</div></article>`;}).join('')||`<p class="empty">${t('noMatch')}</p>`;
  $('#recList').innerHTML=html+'</div>';
}
function recipeText(r){return t('recipeHead',{n:L(r.name),t:r.time,s:state.serv})+'\n'+r.ing.map(([n,q,u])=>'• '+ingL(n)+' – '+fmtQ(q*factor(),u)).join('\n')+(r.kid?'\n'+t('forKids')+' '+L(r.kid):'')+(r.steps?'\n\n'+r.steps:'')+'\n\n'+t('fromApp',{app:t('app')});}
function renderCommunity(){
  const fol=state.following||[];
  let html=`<div class="summary"><div class="stat"><span class="label">${t('youFollow')}</span><br><b>${num(fol.length)}</b> <span class="hint">${t('cooks')}</span></div><span class="hint">${t('sampleNote')}</span></div><div class="cooks">`;
  html+=COOKS.map(c=>{const on=fol.includes(c.id),nm=L(c.name);return `<article class="panel cook"><div class="chead"><span class="avatar" aria-hidden="true">${esc(nm[0])}</span><div><h3>${esc(nm)} <span class="sample">${t('sample')}</span></h3><div class="hint">${t('followers',{n:num(c.followers)})}</div></div></div><p class="hint" style="margin:0">${esc(L(c.bio))}</p><div class="meta">${c.modes.map(k=>`<span class="tag t-${k}">${tagL(k)}</span>`).join('')}</div><div><button class="ghost follow" data-follow="${c.id}" aria-pressed="${on}">${on?t('following'):t('follow')}</button></div></article>`;}).join('');
  html+=`</div><div class="feed"><h2>${t('feedTitle')}</h2>`;
  const fc=COOKS.filter(c=>fol.includes(c.id));
  if(!fc.length)html+=`<p class="empty">${t('feedEmpty')}</p>`;
  fc.forEach(c=>{
    html+=`<article class="panel"><h3>${esc(t('planOf',{n:L(c.name)}))}</h3><ul class="mini">${c.plan.map((id,d)=>`<li><b>${day(d)}</b>${esc(L(byId(id).name))}</li>`).join('')}</ul>
     <div class="rfoot" style="margin-top:10px"><button class="primary" data-copyplan="${c.id}">${t('copyPlan')}</button></div>
     <h3 style="margin-top:14px">${t('sharedRecipes')}</h3><div class="meta">${c.recipes.map(id=>`<button class="ghost" data-share="${id}">${esc(L(byId(id).name))}</button>`).join('')}</div></article>`;
  });
  $('#v-community').innerHTML=html+'</div>';
}

/* ---------- add recipe form ---------- */
const MAX_PHOTOS=3,MAX_MB=10,OK_TYPES=['image/jpeg','image/png','image/webp','image/gif'];
const blankRow=()=>({n:'',q:'',u:U,a:'veg'});
let draft={ing:[blankRow(),blankRow(),blankRow()],photos:[],fields:{name:'',time:'30',steps:'',kid:'',tags:[]},open:false};
function captureFields(){
  if(!$('#addForm'))return;
  draft.fields={name:$('#nName').value,time:$('#nTime').value,steps:$('#nSteps').value,kid:$('#nKid').value,tags:TAG_KEYS.filter(k=>$('#nt-'+k).checked)};
  draft.open=$('#addBox').open;
}
function renderAddForm(){
  const f=draft.fields;
  $('#addWrap').innerHTML=`<details class="panel addbox" id="addBox"${draft.open?' open':''}><summary><b>${t('addTitle')}</b></summary>
   <form class="addform" id="addForm" novalidate>
    <div class="errsum" id="errSum" role="alert" tabindex="-1" hidden></div>
    <div class="row">
     <div class="field grow"><label class="label" for="nName">${t('fName')}</label><input type="text" id="nName" maxlength="60" value="${esc(f.name)}" aria-describedby="e-name"><p class="err" id="e-name" hidden></p></div>
     <div class="field"><label class="label" for="nTime">${t('fTime')}</label><input type="number" id="nTime" min="5" max="240" step="5" value="${esc(f.time)}" aria-describedby="e-time"><p class="err" id="e-time" hidden></p></div>
    </div>
    <fieldset class="field"><legend class="label">${t('fTags')}</legend><div class="row">${TAG_KEYS.map(k=>`<label class="check"><input type="checkbox" id="nt-${k}" value="${k}"${f.tags.includes(k)?' checked':''}> ${tagL(k)}</label>`).join('')}</div></fieldset>
    <div class="field" id="kidField"${f.tags.includes('kids')?'':' hidden'}><label class="label" for="nKid">${t('fKid')}</label><input type="text" id="nKid" maxlength="100" value="${esc(f.kid)}" placeholder="${t('fKidPh')}"></div>
    <fieldset class="field"><legend class="label">${t('fIng')}</legend>
     <div class="inghead" aria-hidden="true"><span>${t('colIng')}</span><span>${t('colQty')}</span><span>${t('colUnit')}</span><span>${t('colAisle')}</span><span></span></div>
     <div id="ingRows"></div>
     <p class="err" id="e-ing" hidden></p>
     <div><button type="button" class="ghost" id="addIng">${t('addIng')}</button></div>
    </fieldset>
    <div class="field"><label class="label" for="nSteps">${t('fSteps')}</label><textarea id="nSteps" maxlength="3000" placeholder="${esc(t('stepsPh')).replace(/\n/g,'&#10;')}" aria-describedby="e-steps">${esc(f.steps)}</textarea><p class="err" id="e-steps" hidden></p></div>
    <div class="field"><span class="label" id="photoLbl">${t('fPhotos',{m:MAX_PHOTOS})}</span>
     <div class="photogrid" id="photoPrev"></div>
     <p class="hint" id="photoHint">${t('photoHint',{mb:MAX_MB})}</p>
     <p class="err" id="e-photo" hidden></p>
    </div>
    <div class="row"><button class="primary" type="submit">${t('saveBtn')}</button><button class="ghost" type="button" id="resetForm">${t('resetBtn')}</button></div>
   </form></details>`;
  renderIngRows();renderPhotos();
}
function renderIngRows(){
  const aisleOpts=a=>AISLE_ORDER.map(k=>`<option value="${k}"${k===a?' selected':''}>${aisle(k)}</option>`).join('');
  $('#ingRows').innerHTML=draft.ing.map((r,i)=>`<div class="ingrow" data-i="${i}">
    <input type="text" id="ing-n-${i}" data-f="n" aria-label="${t('ingNameAria',{i:i+1})}" maxlength="40" value="${esc(r.n)}" placeholder="${t('ingPh')}">
    <input type="number" id="ing-q-${i}" data-f="q" aria-label="${t('qtyAria',{i:i+1})}" min="0" step="any" value="${esc(r.q)}">
    <select id="ing-u-${i}" data-f="u" aria-label="${t('unitAria',{i:i+1})}">${UNITS.map(u=>`<option value="${u}"${u===r.u?' selected':''}>${unitL(u)}</option>`).join('')}</select>
    <select id="ing-a-${i}" data-f="a" aria-label="${t('aisleAria',{i:i+1})}">${aisleOpts(r.a)}</select>
    <button type="button" class="ghost icon" data-rmrow="${i}" aria-label="${t('rmIng',{i:i+1})}"${draft.ing.length<=1?' disabled':''}>×</button>
   </div>`).join('');
}
function renderPhotos(){
  const tiles=draft.photos.map((p,i)=>`<figure class="ptile"><img src="${p}" alt="${t('photoN',{i:i+1})}">${i===0?`<span class="pmain">${t('mainPhoto')}</span>`:''}<button type="button" class="pdel" data-rmphoto="${i}" aria-label="${t('rmPhoto',{i:i+1})}">×</button></figure>`).join('');
  const left=MAX_PHOTOS-draft.photos.length;
  const add=left>0?`<label class="ptile padd" for="nPhotos"><span>+</span><small>${t('addPhoto')}<br>${t('left',{n:left})}</small></label><input type="file" id="nPhotos" accept="image/jpeg,image/png,image/webp,image/gif" multiple class="sr" aria-labelledby="photoLbl" aria-describedby="photoHint e-photo">`:'';
  $('#photoPrev').innerHTML=tiles+add;
}
function shrink(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(fr.error);fr.onload=()=>{const img=new Image();img.onerror=()=>rej(new Error('decode'));img.onload=()=>{const s=Math.min(1,900/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72));};img.src=fr.result;};fr.readAsDataURL(file);});}
async function addPhotos(files){
  const errs=[];
  for(const f of files){
    if(draft.photos.length>=MAX_PHOTOS){errs.push(t('ePhotoMax',{m:MAX_PHOTOS,f:f.name}));continue;}
    if(!OK_TYPES.includes(f.type)){errs.push(t('ePhotoType',{f:f.name}));continue;}
    if(f.size>MAX_MB*1024*1024){errs.push(t('ePhotoSize',{f:f.name,mb:MAX_MB}));continue;}
    try{draft.photos.push(await shrink(f));}catch(e){errs.push(t('ePhotoRead',{f:f.name}));}
  }
  renderPhotos();setErr('e-photo',errs.join(' '));
}
function setErr(id,msg,inputId){
  const p=document.getElementById(id);if(!p)return;p.textContent=msg||'';p.hidden=!msg;
  if(inputId){const el=document.getElementById(inputId);if(el)el.setAttribute('aria-invalid',msg?'true':'false');}
}
const allNames=r=>typeof r.name==='string'?[r.name]:Object.values(r.name);
function validate(){
  const errs=[];let first=null;const mark=(id,msg,inputId)=>{setErr(id,msg,inputId);if(msg){errs.push(msg);if(!first)first=inputId;}};
  const name=$('#nName').value.trim();
  mark('e-name',!name?t('eNameReq'):name.length<2?t('eNameShort'):all().some(r=>allNames(r).some(x=>x.toLowerCase()===name.toLowerCase()))?t('eNameDup'):'','nName');
  const tv=$('#nTime').value.trim(),tn=Number(tv);
  mark('e-time',!tv?t('eTimeReq'):!Number.isInteger(tn)||tn<5||tn>240?t('eTimeRange'):'','nTime');
  document.querySelectorAll('.ingrow input').forEach(el=>el.setAttribute('aria-invalid','false'));
  const full=draft.ing.filter(r=>r.n.trim()&&Number(r.q)>0);
  const bad=draft.ing.findIndex(r=>(r.n.trim()&&!(Number(r.q)>0))||(!r.n.trim()&&r.q!==''));
  let ingMsg='',ingFocus=null;
  if(bad>=0){const r=draft.ing[bad];ingFocus=!r.n.trim()?`ing-n-${bad}`:`ing-q-${bad}`;ingMsg=!r.n.trim()?t('eIngNoName',{i:bad+1}):t('eIngNoQty',{n:r.n.trim()});}
  else if(full.length<2){const e=draft.ing.findIndex(r=>!r.n.trim());ingMsg=t('eIngMin');ingFocus=`ing-n-${e<0?0:e}`;}
  mark('e-ing',ingMsg,ingFocus);
  const st=$('#nSteps').value.trim();
  mark('e-steps',!st?t('eStepsReq'):st.length<15?t('eStepsShort'):'','nSteps');
  const sum=$('#errSum');
  if(errs.length){sum.innerHTML=`<b>${errs.length===1?t('errSum1'):t('errSumN',{n:errs.length})}</b><ul>${errs.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`;sum.hidden=false;const fe=first&&document.getElementById(first);(fe||sum).focus();}
  else sum.hidden=true;
  return errs.length?null:{name,time:tn,steps:st,ing:full};
}
function resetDraft(open){draft={ing:[blankRow(),blankRow(),blankRow()],photos:[],fields:{name:'',time:'30',steps:'',kid:'',tags:[]},open:!!open};renderAddForm();}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-pressed',!!state.modes[b.dataset.m]));
  $('#serv').textContent=state.serv;
  $('#prepTab').hidden=!state.modes.prep;
  $('#modeHint').hidden=!modeChanged;
  if(view==='prep'&&!state.modes.prep)view='week';
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x.dataset.v===view));
  ['week','shop','prep','recipes','community'].forEach(v=>$('#v-'+v).hidden=v!==view);
  ({week:renderWeek,shop:renderShop,prep:renderPrep,recipes:renderRecipes,community:renderCommunity})[view]();
}
function setLang(l){captureFields();lang=l;state.lang=l;save();renderShell();renderAddForm();render();}

/* ---------- events (delegated, so they survive re-renders) ---------- */
document.addEventListener('click',e=>{
  const g=e.target.closest.bind(e.target);
  const lb=g('[data-lang]');if(lb){if(lb.dataset.lang!==lang)setLang(lb.dataset.lang);return;}
  const md=g('.mode');if(md){state.modes[md.dataset.m]=!state.modes[md.dataset.m];modeChanged=true;save();render();return;}
  if(g('#servUp')){state.serv=Math.min(12,state.serv+1);save();render();return;}
  if(g('#servDown')){state.serv=Math.max(1,state.serv-1);save();render();return;}
  if(g('#autoplan')){autoPlan();modeChanged=false;view='week';render();toast(t('planned'));return;}
  const tb=g('.tab');if(tb){view=tb.dataset.v;render();return;}
  const sw=g('[data-swap]');if(sw){swapDay(+sw.dataset.swap);return;}
  const fl=g('[data-filter]');if(fl){recFilter=fl.dataset.filter;renderRecipes();return;}
  const sh=g('[data-share]');if(sh){copy(recipeText(byId(sh.dataset.share)),t('shareCopied'));return;}
  const fo=g('[data-follow]');if(fo){const id=fo.dataset.follow;state.following=state.following||[];const i=state.following.indexOf(id);if(i>=0)state.following.splice(i,1);else state.following.push(id);save();renderCommunity();return;}
  const cp=g('[data-copyplan]');if(cp){const c=COOKS.find(x=>x.id===cp.dataset.copyplan);state.plan=c.plan.slice();state.checked={};save();view='week';render();toast(t('planCopied',{n:L(c.name)}));return;}
  if(g('#clearChecks')){state.checked={};save();renderShop();return;}
  if(g('#copyList')){copy(listText(),t('copied'),t('copyFail'));return;}
  if(g('#addIng')){if(draft.ing.length>=30){setErr('e-ing',t('eIngMax'));return;}draft.ing.push(blankRow());renderIngRows();document.getElementById('ing-n-'+(draft.ing.length-1)).focus();return;}
  const rr=g('[data-rmrow]');if(rr){draft.ing.splice(+rr.dataset.rmrow,1);renderIngRows();return;}
  const rp=g('[data-rmphoto]');if(rp){draft.photos.splice(+rp.dataset.rmphoto,1);renderPhotos();setErr('e-photo','');return;}
  if(g('#resetForm')){resetDraft(true);return;}
  const dl=g('[data-del]');if(dl){const id=dl.dataset.del;
    if(pendingDel!==id){pendingDel=id;renderRecipes();return;}
    pendingDel=null;state.custom=state.custom.filter(r=>r.id!==id);state.plan=state.plan.map(p=>p===id?null:p);save();renderRecipes();toast(t('deleted'));}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='budget'){state.budget=Math.max(0,+el.value||0);save();render();return;}
  if(el.dataset.day!==undefined){state.plan[+el.dataset.day]=el.value||null;save();render();return;}
  if(el.dataset.key){state.checked[el.dataset.key]=el.checked;save();renderShop();return;}
  if(el.dataset.assign&&el.value!==''){state.plan[+el.value]=el.dataset.assign;save();toast(t('addedTo',{d:day(+el.value)}));renderRecipes();return;}
  if(el.id==='nPhotos'){const files=[...el.files];el.value='';if(files.length)addPhotos(files);return;}
  if(el.id==='nt-kids'){$('#kidField').hidden=!el.checked;}
  const row=el.closest('.ingrow');if(row&&el.dataset.f){draft.ing[+row.dataset.i][el.dataset.f]=el.value;}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='rsearch'){recSearch=el.value.trim();const pos=el.selectionStart;renderRecipes();const n=$('#rsearch');n.focus();n.setSelectionRange(pos,pos);return;}
  const row=el.closest('.ingrow');
  if(row&&el.dataset.f){draft.ing[+row.dataset.i][el.dataset.f]=el.value;el.setAttribute('aria-invalid','false');}
  if(el.id==='nName')setErr('e-name','','nName');
  if(el.id==='nTime')setErr('e-time','','nTime');
  if(el.id==='nSteps')setErr('e-steps','','nSteps');
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='addForm')return;e.preventDefault();
  const v=validate();if(!v)return;
  const tags=TAG_KEYS.filter(k=>$('#nt-'+k).checked);
  const kid=tags.includes('kids')?$('#nKid').value.trim():'';
  const rec={id:'c'+Date.now(),name:v.name,time:v.time,m:'stove',tags,ing:v.ing.map(r=>[r.n.trim(),Number(r.q),r.u,r.a,0]),steps:v.steps,photos:draft.photos.slice(),keep:tags.includes('prep')?3:0,custom:true};
  if(kid)rec.kid=kid;
  state.custom.push(rec);
  if(!save()){state.custom.pop();const sum=$('#errSum');sum.innerHTML=t('eStorage');sum.hidden=false;sum.focus();return;}
  recFilter='all';recSearch='';renderRecipes();resetDraft(false);toast(t('saved'));
});

if(!state.plan||state.plan.length!==7)autoPlan();
renderShell();renderAddForm();render();
</script>
