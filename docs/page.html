<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #FAF7F6; --ink: #3A3340; --muted: #8F8792; --accent: #A3546F; --line: #EEE8EA; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151317; --ink: #F1ECEE; --muted: #A79FAA; --accent: #E59AB4; --line: #37313A; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 -apple-system, system-ui, "Segoe UI", Rubik, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  header img { width: 56px; height: 56px; border-radius: 14px; }
  header a { color: var(--ink); text-decoration: none; font-weight: 600; font-size: 20px; }
  a { color: var(--accent); }
  h1 { font-size: 28px; margin: 24px 0 4px; }
  h2 { font-size: 19px; margin: 28px 0 6px; }
  .muted { color: var(--muted); }
  .langs { margin: 16px 0; color: var(--muted); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 48px 0; }
</style>
</head>
<body>
<main>
<header><img src="icon.png" alt=""><a href="./">Weekly Plate</a></header>
{{body}}
</main>
</body>
</html>
